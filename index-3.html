<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>우리 결혼 준비 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a planner's ledger — sticky tab bar, then one working surface per tab; records are cards that open into forms */
:root{
  --bg:#F5F4F7; --surface:#FFFFFF; --ink:#24212B; --muted:#6C6775; --line:#E2DFE6;
  --accent:#6E3B5E; --accent-soft:#F1E7EE; --good:#3F7559; --good-soft:#E3EFE8;
  --warn:#9A6514; --warn-soft:#F6EBD8; --bad:#A63B3B; --bad-soft:#F6E1E1;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18161C; --surface:#221F27; --ink:#EEEAF2; --muted:#A39DAB; --line:#37323D;
  --accent:#D9A4C7; --accent-soft:#3A2A35; --good:#8CC7A5; --good-soft:#203229;
  --warn:#E2B66A; --warn-soft:#3A2F1E; --bad:#E89494; --bad-soft:#3B2323; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18161C; --surface:#221F27; --ink:#EEEAF2; --muted:#A39DAB; --line:#37323D;
  --accent:#D9A4C7; --accent-soft:#3A2A35; --good:#8CC7A5; --good-soft:#203229;
  --warn:#E2B66A; --warn-soft:#3A2F1E; --bad:#E89494; --bad-soft:#3B2323; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.login{min-height:80vh;justify-content:center;align-items:center;text-align:center}
.login .box{display:flex;flex-direction:column;align-items:stretch;gap:14px;width:100%;max-width:400px;padding:28px 22px}
.login .box button{padding:12px 16px;font-size:1rem}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:22px 72px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-size:.95rem;margin:0;font-weight:600}
.sub{color:var(--muted);margin:2px 0 0;font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.8rem}
label{font-size:.75rem;color:var(--muted);letter-spacing:.02em;display:block;margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:68px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:2px 0 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;font-size:.88rem}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:transparent;background:transparent}
a{color:var(--accent)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:transparent;color:var(--muted);white-space:nowrap;padding:7px 11px;border-radius:999px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat span{font-size:.75rem;color:var(--muted);display:block}
.stat b{font-size:1.3rem;font-weight:600}
.dday{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1;color:var(--accent)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:5px 11px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:7px;min-width:0}
.card.out{opacity:.55}
.row1{display:flex;gap:10px;align-items:flex-start}
.row1 .grow{flex:1;min-width:0}
.name{font-family:var(--display);font-weight:700;font-size:1.08rem;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.pill{font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--line);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.review{font-size:.86rem;margin:0}
.review b{color:var(--muted);font-weight:500}
.nums{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.84rem}
.nums em{font-style:normal;color:var(--muted);margin-right:4px}
.total{font-weight:600}
.over{color:var(--bad)} .under{color:var(--good)}
.note{font-size:.85rem;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions a{font-size:.85rem;text-decoration:none;font-weight:500}
.actions a:hover{text-decoration:underline}
.stars{color:var(--accent);letter-spacing:1px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.form .wide{grid-column:1/-1}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.task .grow{flex:1;min-width:0}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:500;overflow-wrap:anywhere}
.phase{display:flex;flex-direction:column}
.phase h3{padding-bottom:4px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.tip{display:flex;flex-direction:column;gap:6px}
.tip p{margin:0;font-size:.9rem;max-width:68ch}
.tip ul{margin:0;padding-left:1.1em;font-size:.9rem;max-width:68ch}
.src{font-size:.75rem;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.banner{font-size:.82rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .15s}}
</style>
</head>
<body>
<div class="wrap login" id="login">
  <div class="box">
    <h1>우리 결혼 준비 노트</h1>
    <p class="sub" id="login-msg">초대된 구글 계정으로 로그인하세요.</p>
    <button class="primary" id="login-btn">구글 계정으로 로그인</button>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <h1>우리 결혼 준비 노트</h1>
    <div class="row1"><p class="sub grow" id="headline">일정, 예산, 웨딩홀, 스드메, 하객까지 둘이 같이 고치는 준비 노트예요.</p><button class="ghost small" id="logout-btn">로그아웃</button></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="메뉴"></nav>
  <p class="banner" id="banner">불러오는 중…</p>
  <main id="view" class="panel" role="tabpanel"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ---------- constants ---------- */
const TABS=[["home","홈"],["tasks","일정"],["budget","예산"],["venues","웨딩홀"],["vendors","스드메·업체"],["guests","하객·축의금"],["tips","꿀팁"]];
const V_STATUS=["후보","문의함","투어예약","투어완료","계약","제외"];
const V_TYPES=["호텔","하우스·가든","채플","컨벤션","스몰웨딩"];
const VEN_CATS=["스튜디오","드레스","메이크업","스냅·DVD","예물·반지","예복·한복","청첩장","신혼여행","기타"];
const VEN_STATUS=["후보","상담예약","상담완료","계약","제외"];
const BUD_CATS=["웨딩홀","스드메","스냅·DVD","예물·반지","예복·한복","청첩장","답례품","신혼여행","혼주","신혼집·혼수","예비비","기타"];
const OWNERS=["같이","신부","신랑"];
const SIDES=["신부측","신랑측"];
const G_GROUPS=["가족·친척","친구","회사","지인","기타"];
const ATTEND=["미정","참석","불참"];
const PILL={후보:"",문의함:"p-accent",상담예약:"p-accent",투어예약:"p-warn",투어완료:"p-warn",상담완료:"p-warn",계약:"p-good",제외:"p-bad",참석:"p-good",불참:"p-bad",미정:""};
const CAT_COLORS=["var(--accent)","var(--good)","var(--warn)","var(--bad)","var(--muted)","var(--ink)"];

/* ---------- state ---------- */
let db=null, readOnly=false, dl=null;
const S={plan:{},venues:[],vendors:[],tasks:[],budget:[],guests:[]};
const loaded={};
let tab="home", openKey=null;
const UI={vStatus:"전체",vRegion:"",vSort:"status",venCat:"전체",venStatus:"전체",tOwner:"전체",tHideDone:false,gSide:"전체",gAttend:"전체",gQuery:""};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=v=>{const x=parseFloat(String(v??"").replace(/,/g,""));return isFinite(x)?x:0};
const fmt=v=>Math.round(v).toLocaleString("ko-KR");
const man=v=>`${fmt(v)}만`;
const safeUrl=u=>/^https?:\/\//i.test(String(u||"").trim())?String(u).trim():"";
const DAY=86400000;
function today0(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function md(d){return `${d.getMonth()+1}/${d.getDate()}`}
function dday(){const w=parseDate(S.plan.weddingDate);return w?Math.round((w-today0())/DAY):null}
function taskDue(t){const w=parseDate(S.plan.weddingDate);if(!w||t.offset===""||t.offset==null)return null;const d=new Date(w);d.setDate(d.getDate()-Math.round(n(t.offset)));return d}
function phaseOf(off){off=n(off);if(off>=270)return"D-12~9개월";if(off>=180)return"D-9~6개월";if(off>=90)return"D-6~3개월";if(off>=30)return"D-3~1개월";if(off>=0)return"마지막 한 달";return"결혼식 이후"}
const PHASES=["D-12~9개월","D-9~6개월","D-6~3개월","D-3~1개월","마지막 한 달","결혼식 이후"];
function venueEstimate(v){
  const guests=Math.max(n(v.minGuests),n(S.plan.guests));
  if(!n(v.rental)&&!n(v.flower)&&!n(v.meal))return null;
  return n(v.rental)+n(v.flower)+n(v.extra)+n(v.meal)*guests/10000;
}
function vendorTotal(v){const q=n(v.quote),x=n(v.extraCost);return q||x?q+x:null}
function budgetSums(){
  const planned=S.budget.reduce((a,b)=>a+n(b.planned),0);
  const paid=S.budget.reduce((a,b)=>a+n(b.paid),0);
  const total=n(S.plan.totalBudget);
  return {planned,paid,total};
}
function giftSums(){
  const r={신부측:0,신랑측:0,count:0,attend:0,undecided:0};
  S.guests.forEach(g=>{r[g.side]=(r[g.side]||0)+n(g.gift);if(n(g.gift))r.count++;if(g.attend==="참석")r.attend+=Math.max(1,n(g.party)||1);if(!g.attend||g.attend==="미정")r.undecided++});
  return r;
}
const CSV_COLS={
  venues:[["name","이름"],["region","지역"],["area","동네"],["type","유형"],["status","상태"],["rental","대관료(만원)"],["flower","꽃장식(만원)"],["meal","식대(원)"],["minGuests","보증인원"],["extra","기타(만원)"],["contact","연락처"],["availableDates","가능일"],["link","링크"],["review","후기"],["note","메모"]],
  vendors:[["name","업체"],["category","분류"],["area","지역"],["style","스타일"],["status","상태"],["quote","기본견적(만원)"],["extraCost","추가금(만원)"],["contact","연락처"],["link","링크"],["review","후기"],["note","메모"]],
  budget:[["category","분류"],["item","항목"],["planned","예산(만원)"],["deposit","계약금(만원)"],["paid","결제(만원)"],["payDate","결제일"],["note","메모"]],
  guests:[["name","이름"],["side","측"],["group","관계"],["party","인원"],["invited","청첩장 전달일"],["attend","참석"],["gift","축의금(원)"],["thanks","답례"],["note","메모"]],
  tasks:[["title","할 일"],["offset","D-일"],["owner","담당"],["done","완료"],["note","메모"]]};
const CSV_NAME={venues:"웨딩홀",vendors:"스드메_업체",budget:"예산",guests:"하객_축의금",tasks:"일정"};
function toCSV(col){
  const cols=CSV_COLS[col], q=v=>{v=v===true?"O":v===false?"":String(v??"");if(/^[=+@\t]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return "\ufeff"+[cols.map(c=>q(c[1])).join(","),...S[col].map(r=>cols.map(c=>q(r[c[0]])).join(","))].join("\r\n");
}
const exportBtn=col=>dl&&S[col].length?`<button class="ghost" data-export="${col}">표로 저장</button>`:"";
const pill=s=>`<span class="pill ${PILL[s]||""}">${esc(s)}</span>`;

/* ---------- generic form ---------- */
function fieldHTML(f,val){
  const id="f-"+f.k, w=f.wide?' class="wide"':"";
  if(f.t==="select")return `<div${w}><label for="${id}">${f.l}</label><select id="${id}">${f.o.map(o=>`<option ${String(o)===String(val??f.d??"")?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
  if(f.t==="area")return `<div${w}><label for="${id}">${f.l}</label><textarea id="${id}" placeholder="${esc(f.p||"")}">${esc(val)}</textarea></div>`;
  const type=f.t==="money"||f.t==="int"?"text":f.t||"text";
  const im=f.t==="money"||f.t==="int"?' inputmode="numeric"':"";
  return `<div${w}><label for="${id}">${f.l}</label><input id="${id}" type="${type}"${im} value="${esc(val)}" placeholder="${esc(f.p||"")}"></div>`;
}
function formHTML(schema,rec){
  return `<div class="form">${schema.map(f=>fieldHTML(f,rec[f.k])).join("")}
  <div class="wide actions"><button class="primary" data-act="save">저장</button><button class="ghost" data-act="cancel">취소</button><span class="spacer"></span>${rec.id&&rec.id!=="__new"?'<button class="danger" data-act="del">삭제</button>':""}<span class="meta" data-msg role="status"></span></div></div>`;
}
function readSchema(root,schema){
  const out={};
  schema.forEach(f=>{const el=root.querySelector("#f-"+f.k);if(!el)return;let v=el.value.trim();if(f.t==="money"||f.t==="int")v=v.replace(/,/g,"");out[f.k]=v});
  out.updatedAt=new Date().toISOString();
  return out;
}

const SCHEMA={
  venues:[
    {k:"name",l:"이름"},{k:"region",l:"지역",t:"select",o:["서울","경기"],d:"서울"},{k:"area",l:"동네",p:"예: 역삼"},
    {k:"type",l:"유형",t:"select",o:["",...V_TYPES]},{k:"status",l:"진행 상태",t:"select",o:V_STATUS,d:"후보"},{k:"rating",l:"우리 별점",t:"select",o:["0","1","2","3","4","5"],d:"0"},
    {k:"contactDate",l:"문의한 날",t:"date"},{k:"tourDate",l:"투어 날짜",t:"date"},{k:"availableDates",l:"가능한 예식일·시간",p:"예: 5/15 11:30"},
    {k:"rental",l:"대관료 (만원)",t:"money"},{k:"flower",l:"꽃장식 (만원)",t:"money"},{k:"meal",l:"식대 1인 (원)",t:"money",p:"예: 69000"},
    {k:"minGuests",l:"보증인원 (명)",t:"int"},{k:"extra",l:"기타 비용 (만원)",t:"money",p:"스냅·연출료 등"},{k:"contact",l:"담당자·연락처"},
    {k:"link",l:"홈페이지",t:"url",p:"https://",wide:1},{k:"review",l:"후기 요약",t:"area",wide:1},{k:"note",l:"문의 메모 (주차, 시식, 프로모션, 느낀 점…)",t:"area",wide:1}],
  vendors:[
    {k:"name",l:"업체 이름"},{k:"category",l:"분류",t:"select",o:VEN_CATS,d:"스튜디오"},{k:"area",l:"지역",p:"예: 청담"},
    {k:"style",l:"스타일",p:"예: 인물 중심, 실크 드레스"},{k:"status",l:"진행 상태",t:"select",o:VEN_STATUS,d:"후보"},{k:"rating",l:"우리 별점",t:"select",o:["0","1","2","3","4","5"],d:"0"},

    <div><label for="p-guests">예상 하객 (명)</label><input id="p-guests" inputmode="numeric" ${readOnly?"disabled":""} value="${esc(S.plan.guests)}" placeholder="예: 200"></div>
    <div><label for="p-budget">식장 예산 (만원)</label><input id="p-budget" inputmode="numeric" ${readOnly?"disabled":""} value="${esc(S.plan.budget)}" placeholder="예: 3000"></div>

    ${upcoming.length?`<div>${upcoming.map(({t,due})=>{const late=due&&due<t0;return `<div class="task"><input type="checkbox" data-done="${esc(t.id)}" aria-label="${esc(t.title)} 완료" ${readOnly?"disabled":""}><div class="grow"><div class="t-title">${esc(t.title)}</div><div class="meta">${due?`${late?'<span class="over">지남 · </span>':""}${md(due)}까지`:`${phaseOf(t.offset)}`} · ${esc(t.owner||"같이")}</div></div></div>`}).join("")}</div>`:`<p class="hint">${S.tasks.length?"남은 할 일이 없어요.":"일정 탭에서 할 일을 추가하세요."}</p>`}

  const t0=today0();
  let list=S.tasks.filter(t=>(UI.tOwner==="전체"||(t.owner||"같이")===UI.tOwner)&&!(UI.tHideDone&&t.done));
  list.sort((a,c)=>n(c.offset)-n(a.offset)||String(a.title).localeCompare(c.title,"ko"));
  const groups=PHASES.map(p=>[p,list.filter(t=>phaseOf(t.offset)===p)]).filter(([,l])=>l.length);

    const due=taskDue(t), late=due&&!t.done&&due<t0, open=openKey==="tasks:"+t.id;
    return `<div class="task ${t.done?"done":""}" data-col="tasks" data-id="${esc(t.id)}">

    <label class="small" style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="t-hide" ${UI.tHideDone?"checked":""}>완료 숨기기</label>

  </div>

  ${newOpen?`<div class="box" data-col="tasks" data-id="__new">${formHTML(SCHEMA.tasks,{id:"__new",owner:"같이"})}</div>`:""}
  ${groups.length?groups.map(([p,l])=>`<section class="box phase"><h3>${p} <span class="muted small">${l.filter(t=>t.done).length}/${l.length}</span></h3>${l.map(item).join("")}</section>`).join(""):`<div class="empty">${S.tasks.length?"조건에 맞는 할 일이 없어요.":"할 일이 아직 없어요. ‘+ 할 일’로 추가하세요."}</div>`}`;
}

function renderBudget(){
  const b=budgetSums();
  const byCat=BUD_CATS.map(c=>{const rows=S.budget.filter(r=>(r.category||"기타")===c);return {c,rows,planned:rows.reduce((a,r)=>a+n(r.planned),0),paid:rows.reduce((a,r)=>a+n(r.paid),0)}}).filter(x=>x.rows.length);
  const base=Math.max(b.total,b.planned,1);
  const top=byCat.filter(x=>x.planned>0).sort((a,c)=>c.planned-a.planned);
  const shown=top.slice(0,5), rest=top.slice(5).reduce((a,x)=>a+x.planned,0);
  const segs=[...shown.map((x,i)=>({l:x.c,v:x.planned,col:CAT_COLORS[i]})),...(rest?[{l:"그 외",v:rest,col:CAT_COLORS[5]}]:[])];
  const venueC=S.venues.find(v=>v.status==="계약");
  const t0=today0();
  const rowsHTML=byCat.map(x=>x.rows.sort((a,c)=>String(a.item).localeCompare(c.item,"ko")).map(r=>{
    const open=openKey==="budget:"+r.id, pd=parseDate(r.payDate), soon=pd&&pd>=t0&&(pd-t0)/DAY<=14;
    return open?`<tr><td colspan="6" data-col="budget" data-id="${esc(r.id)}">${formHTML(SCHEMA.budget,r)}</td></tr>`:
    `<tr class="${readOnly?"":"click"}" data-edit="budget:${esc(r.id)}" ${readOnly?"":'tabindex="0"'}><td>${esc(r.category)}</td><td>${esc(r.item)}</td><td class="r num">${n(r.planned)?fmt(n(r.planned)):"–"}</td><td class="r num">${n(r.paid)?fmt(n(r.paid)):"–"}</td><td class="r num ${n(r.paid)>n(r.planned)&&n(r.planned)?"over":""}">${n(r.planned)?fmt(n(r.planned)-n(r.paid)):"–"}</td><td class="num">${pd?`${soon?'<span class="pill p-warn">'+md(pd)+"</span>":md(pd)}`:""}</td></tr>`;
  }).join("")).join("");
  const newOpen=openKey==="budget:__new";
  return `<section class="box panel">
    <div class="grid">
      <div class="stat"><span>전체 예산</span><b class="num">${b.total?man(b.total):"미입력"}</b></div>
      <div class="stat"><span>항목별 배정 합계</span><b class="num ${b.total&&b.planned>b.total?"over":""}">${man(b.planned)}</b></div>
      <div class="stat"><span>실제 결제</span><b class="num">${man(b.paid)}</b></div>
      <div class="stat"><span>${b.total?"배정 후 남은 예산":"남은 결제"}</span><b class="num ${b.total&&b.total-b.planned<0?"over":""}">${b.total?man(b.total-b.planned):man(b.planned-b.paid)}</b></div>
    </div>
    ${segs.length?`<div class="bar" role="img" aria-label="분류별 예산 배정 비율">${segs.map(s=>`<i style="width:${(s.v/base*100).toFixed(2)}%;background:${s.col}" title="${esc(s.l)} ${man(s.v)}"></i>`).join("")}</div>
    <div class="legend">${segs.map(s=>`<span><i style="background:${s.col}"></i>${esc(s.l)} ${man(s.v)}</span>`).join("")}${b.total&&b.total>b.planned?`<span><i style="background:var(--line)"></i>미배정 ${man(b.total-b.planned)}</span>`:""}</div>`:'<p class="hint">항목에 예산을 넣으면 분류별 비율이 막대로 보여요.</p>'}
    <p class="hint">선배 부부들은 처음 예산보다 20~30% 넘기 쉽다며 총 예산의 10%를 예비비로 떼어두라고 해요.${venueC&&venueEstimate(venueC)!==null?` 계약한 웨딩홀(${esc(venueC.name)})의 예상 총액은 ${man(venueEstimate(venueC))}이에요.`:""}</p>
  </section>
  <div class="toolbar"><span class="spacer"></span>${exportBtn("budget")}${readOnly?"":'<button class="primary" data-add="budget">+ 예산 항목</button>'}</div>
  ${newOpen?`<div class="box" data-col="budget" data-id="__new">${formHTML(SCHEMA.budget,{id:"__new",category:"웨딩홀"})}</div>`:""}
  ${S.budget.length?`<div class="box tbl"><table><thead><tr><th>분류</th><th>항목</th><th class="r">예산</th><th class="r">결제</th><th class="r">잔액</th><th>결제일</th></tr></thead><tbody>${rowsHTML}</tbody></table><p class="hint" style="margin-top:8px">금액 단위: 만원 · 줄을 누르면 수정해요.</p></div>`:'<div class="empty">예산 항목이 없어요. ‘+ 예산 항목’으로 추가하세요.</div>'}`;
}

function budgetCatFor(v){if(!v.category)return "웨딩홀";return {스튜디오:"스드메",드레스:"스드메",메이크업:"스드메","스냅·DVD":"스냅·DVD","예물·반지":"예물·반지","예복·한복":"예복·한복",청첩장:"청첩장",신혼여행:"신혼여행"}[v.category]||"기타"}
function toBudgetBtn(v,amt){
  if(readOnly||v.id==="__new"||v.status!=="계약"||amt===null||amt===undefined)return "";
  if(S.budget.some(b=>b.item===v.name))return '<span class="meta">예산에 있음</span>';
  return `<button class="ghost" data-act="tobudget">예산에 넣기 (${man(amt)})</button>`;
}
function venueCard(v){
  const est=venueEstimate(v), b=n(S.plan.budget), diff=est!==null&&b?est-b:null, open=openKey==="venues:"+v.id;
  const stars=n(v.rating)?"★".repeat(n(v.rating))+"☆".repeat(5-n(v.rating)):"";
  const link=safeUrl(v.link);
  const dates=[v.contactDate&&`문의 ${esc(v.contactDate)}`,v.tourDate&&`투어 ${esc(v.tourDate)}`,v.availableDates&&`가능일 ${esc(v.availableDates)}`].filter(Boolean).join(" · ");
  return `<article class="card ${v.status==="제외"?"out":""}" data-col="venues" data-id="${esc(v.id)}">
    <div class="row1"><div class="grow"><div class="name">${esc(v.name)}</div>
      <div class="meta">${esc(v.region)} ${esc(v.area)}${v.type?` · ${esc(v.type)}`:""}${stars?` · <span class="stars" aria-label="별점 ${n(v.rating)}">${stars}</span>`:""}</div></div>${pill(v.status||"후보")}</div>
    ${v.review?`<p class="review"><b>후기 · </b>${esc(v.review)}</p>`:""}
    <div class="nums num">${n(v.rental)?`<span><em>대관</em>${man(n(v.rental))}</span>`:""}${n(v.flower)?`<span><em>꽃</em>${man(n(v.flower))}</span>`:""}${n(v.meal)?`<span><em>식대</em>${fmt(n(v.meal))}원</span>`:""}${n(v.minGuests)?`<span><em>보증</em>${fmt(n(v.minGuests))}명</span>`:""}
      ${est!==null?`<span class="total"><em>예상</em>${man(est)}${diff!==null?` <span class="${diff>0?"over":"under"}">(${diff>0?"+":""}${fmt(diff)})</span>`:""}</span>`:'<span class="meta">견적 미입력</span>'}</div>
    ${dates?`<div class="meta">${dates}</div>`:""}
    ${v.note&&!open?`<p class="note">${esc(v.note)}</p>`:""}
    <div class="actions">${!readOnly?`<button data-act="${open?"cancel":"edit"}">${open?"닫기":"문의 결과 입력"}</button>`:""}${link?`<a href="${esc(link)}" target="_blank" rel="noopener">홈페이지·정보 ↗</a>`:""}${v.contact?`<span class="meta">☎ ${esc(v.contact)}</span>`:""}${toBudgetBtn(v,est)}</div>
    ${open?formHTML(SCHEMA.venues,v):""}
  </article>`;
}
function renderVenues(){
  const counts={};S.venues.forEach(v=>counts[v.status||"후보"]=(counts[v.status||"후보"]||0)+1);
  const b=n(S.plan.budget), est=S.venues.filter(v=>v.status!=="제외").map(venueEstimate).filter(x=>x!==null);
  let list=S.venues.filter(v=>(UI.vStatus==="전체"||(v.status||"후보")===UI.vStatus)&&(!UI.vRegion||v.region===UI.vRegion));
  const order={계약:-1,문의함:0,투어예약:1,투어완료:2,후보:3,제외:9};
  list.sort((a,c)=>{
    if(UI.vSort==="total"){const x=venueEstimate(a),y=venueEstimate(c);return (x??1e12)-(y??1e12)}
    if(UI.vSort==="rating")return n(c.rating)-n(a.rating);
    if(UI.vSort==="name")return String(a.name).localeCompare(c.name,"ko");
    return (order[a.status||"후보"]-order[c.status||"후보"])||String(a.name).localeCompare(c.name,"ko");
  });
  const newOpen=openKey==="venues:__new";
  return `<section class="box grid">
      <div class="stat"><span>식장 예산</span><b class="num">${b?man(b):"홈에서 입력"}</b></div>
      <div class="stat"><span>예상 하객</span><b class="num">${n(S.plan.guests)?fmt(n(S.plan.guests))+"명":"홈에서 입력"}</b></div>
      <div class="stat"><span>예산 안에 드는 곳</span><b class="num">${b&&est.length?`${est.filter(x=>x<=b).length} / ${est.length}곳`:"견적 입력 전"}</b></div>
    </section>
    <p class="hint">예상 총액 = 대관료 + 꽃장식 + 기타 + 식대 × (보증인원과 예상 하객 중 큰 수). 금액은 만원, 식대는 원 단위.</p>
    <div class="toolbar">

  renderTabs();
  const d=dday();
  $("#headline").textContent=d===null?"일정, 예산, 웨딩홀, 스드메, 하객까지 둘이 같이 고치는 준비 노트예요.":`${S.plan.weddingDate} 결혼식 · ${d>0?`D-${d}`:d===0?"오늘이에요":`D+${-d}`}`;
  const focusId=document.activeElement&&document.activeElement.id;
  $("#view").innerHTML=RENDER[tab]();
  if(focusId&&/^(g-q|p-)/.test(focusId)){const el=document.getElementById(focusId);if(el){el.focus();if(el.setSelectionRange&&el.type!=="date"){const l=el.value.length;try{el.setSelectionRange(l,l)}catch(e){}}}}
}

/* ---------- writes ---------- */
async function saveRec(col,id,root){
  const data=readSchema(root,SCHEMA[col]);
  if(col==="tasks"){data.offset=data.offset===""?"":n(data.offset);if(!data.title)throw{code:"empty",message:"할 일 내용을 적어 주세요."};if(id==="__new")data.done=false}
  if(col==="venues"||col==="vendors"){data.rating=n(data.rating);if(!data.name)data.name="이름 없음"}
  if(col==="guests"&&!data.name)throw{code:"empty",message:"이름을 적어 주세요."};
  if(col==="budget"&&!data.item)data.item=data.category;
  if(id==="__new")await db.collection(col).add(data);
  else{const prev={...(S[col].find(r=>r.id===id)||{})};delete prev.id;await db.doc(col+"/"+id).set({...prev,...data})}
}
function errMsg(err){
  if(err&&err.code==="empty")return err.message;
  if(err&&(err.code==="invalid_argument"||err.code==="permission-denied")){readOnly=true;return "수정 권한이 없어요. 공유 메뉴에서 편집 권한을 받아야 해요.";}
  if(err&&err.code==="quota_exceeded")return "저장 공간이 가득 찼어요. 안 쓰는 항목을 지워 주세요.";
  return "저장하지 못했어요. 잠시 후 다시 눌러 주세요.";
}

document.addEventListener("click",async e=>{
  const t=e.target;
  const tb=t.closest("[data-tab]");if(tb){tab=tb.dataset.tab;openKey=null;try{localStorage.setItem("wedding-tab",tab)}catch(_){}history.replaceState(null,"","#"+tab);render();window.scrollTo(0,0);return}
  const go=t.closest("[data-go]");if(go){tab=go.dataset.go;openKey=null;render();window.scrollTo(0,0);return}
  const bk=t.closest("[data-backup]");if(bk){
    const collections={};["venues","vendors","tasks","budget","guests"].forEach(c=>{collections[c]={};S[c].forEach(r=>{const {id,...rest}=r;collections[c][id]=rest})});
    collections.settings={plan:S.plan};
    downloadFile(`결혼준비_백업_${ymd(new Date())}.json`,JSON.stringify({app:"wedding-notes",version:1,collections},null,1),"application/json");return}
  const ex=t.closest("[data-export]");if(ex&&dl){const col=ex.dataset.export;ex.disabled=true;
    try{await dl.save({filename:`${CSV_NAME[col]}_${ymd(new Date())}.csv`,data:toCSV(col)});$("#banner").textContent="표를 저장했어요."}
    catch(err){$("#banner").textContent=err&&err.code==="declined"?"저장을 취소했어요.":"이 화면에서는 파일 저장을 할 수 없어요."}
    ex.disabled=false;return}
  const ui=t.closest("[data-ui]");if(ui){UI[ui.dataset.ui]=ui.dataset.v;render();return}
  const add=t.closest("[data-add]");if(add){openKey=add.dataset.add+":__new";render();const f=document.querySelector("#f-name,#f-title,#f-item");if(f){f.focus();if(f.select)f.select()}return}
  const ed=t.closest("[data-edit]");if(ed&&!readOnly&&!t.closest(".form")){openKey=ed.dataset.edit;render();return}
  const btn=t.closest("button[data-act]");if(!btn)return;
  const host=btn.closest("[data-col]");if(!host)return;
  const col=host.dataset.col,id=host.dataset.id,act=btn.dataset.act;
  if(act==="edit"){openKey=col+":"+id;render();return}
  if(act==="cancel"){openKey=null;render();return}
  if(act==="tobudget"){
    const rec=S[col].find(r=>r.id===id);if(!rec||!db)return;
    const amt=col==="venues"?venueEstimate(rec):vendorTotal(rec);
    btn.disabled=true;
    try{await db.collection("budget").add({category:budgetCatFor(rec),item:rec.name,planned:String(Math.round(amt)),deposit:"",paid:"",payDate:"",note:"계약 견적에서 자동으로 넣음",updatedAt:new Date().toISOString()});$("#banner").textContent=`${rec.name}을(를) 예산에 넣었어요.`}
    catch(err){btn.disabled=false;$("#banner").textContent=errMsg(err)}
    return;
  }
  const msg=host.querySelector("[data-msg]");
  if(!db){if(msg)msg.textContent="저장소에 연결되지 않았어요.";return}
  try{
    if(act==="save"){btn.disabled=true;if(msg)msg.textContent="저장 중…";await saveRec(col,id,host);openKey=null;render()}
    else if(act==="del"){
      if(btn.dataset.confirm!=="1"){btn.dataset.confirm="1";btn.textContent="한 번 더 누르면 삭제돼요";return}
      btn.disabled=true;await db.doc(col+"/"+id).delete();openKey=null;render();
    }
  }catch(err){btn.disabled=false;if(msg)msg.textContent=errMsg(err)}
});
document.addEventListener("keydown",e=>{const r=e.target.closest&&e.target.closest("tr[data-edit]");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();r.click()}});

document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.done){
    const id=t.dataset.done, task=S.tasks.find(x=>x.id===id);if(!task||!db)return;
    t.disabled=true;
    try{await db.doc("tasks/"+id).update({done:t.checked,doneAt:t.checked?new Date().toISOString():""})}catch(err){t.checked=!t.checked;$("#banner").textContent=errMsg(err)}
    t.disabled=false;return;
  }
  if(t.id==="t-hide"){UI.tHideDone=t.checked;render();return}
  if(t.id==="v-region"){UI.vRegion=t.value;render();return}
  if(t.id==="v-sort"){UI.vSort=t.value;render();return}
  if(t.id==="ven-status"){UI.venStatus=t.value;render();return}
  if(t.id==="g-attend"){UI.gAttend=t.value;render();return}
  if(t.id==="p-wedding")queuePlan();
  if((t.id==="import-file"||t.id==="import-file-top")&&t.files&&t.files[0])importBackup(t.files[0]);
});
let planTimer=null, qTimer=null, pendingRender=false;
function queuePlan(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim().replace(/,/g,""):undefined};
  const next={...S.plan};
  [["p-wedding","weddingDate"],["p-total","totalBudget"],["p-guests","guests"],["p-budget","budget"]].forEach(([id,k])=>{const v=g(id);if(v!==undefined)next[k]=v});
  S.plan=next;
  clearTimeout(planTimer);
  planTimer=setTimeout(async()=>{if(!db||readOnly)return;try{await db.doc("settings/plan").set(S.plan)}catch(err){$("#banner").textContent=errMsg(err)}},700);
}
document.addEventListener("input",e=>{
  const id=e.target.id||"";
  if(/^p-(total|guests|budget)$/.test(id)){queuePlan();clearTimeout(qTimer);qTimer=setTimeout(render,500)}
  if(id==="g-q"){UI.gQuery=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(render,250)}
});

/* ---------- files ---------- */
function downloadFile(name,data,type){
  const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function importBackup(file){
  const msg=document.getElementById("backup-msg");
  try{
    const text=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsText(file)});const j=JSON.parse(text);const cols=j&&j.collections;if(!cols)throw new Error("형식");
    let n=0,batch=db.batch(),inBatch=0;
    for(const [c,docs] of Object.entries(cols)){
      if(!["venues","vendors","tasks","budget","guests","settings"].includes(c))continue;
      for(const [id,data] of Object.entries(docs||{})){
        batch.set(db.collection(c).doc(id),data);n++;inBatch++;
        if(inBatch>=400){await batch.commit();batch=db.batch();inBatch=0}
      }
    }
    if(inBatch)await batch.commit();
    $("#banner").textContent=`백업에서 ${n}개 항목을 불러왔어요.`;if(msg)msg.textContent="";
  }catch(err){if(msg)msg.textContent=err&&err.code?errMsg(err):"백업 파일을 읽지 못했어요. 이 앱에서 받은 .json 파일인지 확인해 주세요."}
}
dl={save:async({filename,data})=>{downloadFile(filename,data,"text/csv;charset=utf-8");return {status:"saved"}}};

/* ---------- boot ---------- */
try{const h=location.hash.replace("#","");const saved=localStorage.getItem("wedding-tab");tab=TABS.some(x=>x[0]===h)?h:TABS.some(x=>x[0]===saved)?saved:"home"}catch(_){}
let unsubs=[];
function startData(){
  unsubs.forEach(u=>u());unsubs=[];
  const watch=col=>db.collection(col).onSnapshot(s=>{
    S[col]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[col]=true;
    $("#banner").textContent=readOnly?"보기 전용이에요.":"실시간 공유 중";
    if(openKey&&document.querySelector(".form")){pendingRender=true;if(!(s.metadata&&s.metadata.hasPendingWrites))$("#banner").textContent="상대방이 내용을 바꿨어요. 지금 입력을 저장하거나 닫으면 반영돼요.";return}
    render();
  },err=>{
    if(err&&err.code==="permission-denied"){showLogin("이 계정은 초대되지 않았어요. 초대된 구글 계정으로 다시 로그인해 주세요.");firebase.auth().signOut();return}
    $("#banner").textContent="목록을 불러오지 못했어요. 새로고침해 주세요.";
  });
  ["venues","vendors","tasks","budget","guests"].forEach(c=>unsubs.push(watch(c)));
  unsubs.push(db.collection("settings").doc("plan").onSnapshot(s=>{
    if(!s.exists)return;
    const active=document.activeElement&&/^p-/.test(document.activeElement.id||"");
    S.plan={...s.data()};
    if(!active)render();
  },()=>{}));
}
function showLogin(m){$("#app").hidden=true;$("#login").hidden=false;if(m)$("#login-msg").textContent=m}
(function(){
  if(!window.firebase||!window.FIREBASE_CONFIG||String(window.FIREBASE_CONFIG.apiKey||"").includes("여기에")){
    showLogin("firebase-config.js에 Firebase 설정값을 넣어야 해요.");$("#login-btn").disabled=true;return;
  }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  db=firebase.firestore();
  const provider=new firebase.auth.GoogleAuthProvider();
  $("#login-btn").addEventListener("click",async()=>{
    try{await firebase.auth().signInWithPopup(provider)}
    catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))firebase.auth().signInWithRedirect(provider);else $("#login-msg").textContent="로그인하지 못했어요. 다시 시도해 주세요."}
  });
  $("#logout-btn").addEventListener("click",()=>firebase.auth().signOut());
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){unsubs.forEach(f=>f());unsubs=[];showLogin();return}
    $("#login").hidden=true;$("#app").hidden=false;$("#banner").textContent="불러오는 중…";
    render();startData();
  });
})();
</script>
</body>
